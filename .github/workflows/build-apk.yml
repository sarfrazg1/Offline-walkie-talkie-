name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          java -version
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          if [ -z "$JAVA_VER" ]; then
            echo "ERROR: Unable to detect Java version."
            exit 1
          fi
          echo "Detected Java major version: $JAVA_VER"
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "ERROR: Java version $JAVA_VER is lower than 17."
            exit 1
          fi
          echo "Java environment verified successfully (version >= 17)."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "Creating temporary debug keystore..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore ./debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          else
            echo "debug.keystore already exists."
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: debug.keystore could not be verified."
            exit 1
          fi
          echo "Debug keystore verified."

      - name: Build the debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected APK not found at $EXPECTED_APK"
            echo "Searching only inside app/build/outputs/apk/..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -name "*.apk" -type f
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: APK is empty."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "ERROR: File does not have .apk extension."; exit 1 ;;
          esac

          echo "APK successfully verified at $EXPECTED_APK"
          ls -lh "$EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_ASSET_DIR=$(mktemp -d)
          cp app/build/outputs/apk/debug/app-debug.apk "${TEMP_ASSET_DIR}/app-debug.apk"
          RELEASE_ASSET_PATH="${TEMP_ASSET_DIR}/app-debug.apk"

          if [ ! -s "$RELEASE_ASSET_PATH" ]; then
            echo "ERROR: Release asset does not exist or is empty at $RELEASE_ASSET_PATH"
            exit 1
          fi

          echo "Prepared release asset at: $RELEASE_ASSET_PATH"
          echo "release_asset_path=$RELEASE_ASSET_PATH" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version

          RELEASE_ASSET="${{ steps.prepare_asset.outputs.release_asset_path }}"
          if [ ! -f "$RELEASE_ASSET" ] || [ ! -s "$RELEASE_ASSET" ]; then
            echo "ERROR: Prepared APK is missing or empty."
            exit 1
          fi

          case "$RELEASE_ASSET" in
            */app-debug.apk) ;;
            *) echo "ERROR: Release asset filename must be exactly app-debug.apk"; exit 1 ;;
          esac

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES=$(cat <<EOF
          ### Automated Debug APK Build

          This is an automatically generated debug APK built by GitHub Actions.

          - **Workflow Run Number:** ${{ github.run_number }}
          - **Workflow Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit SHA:** ${{ github.sha }}
          - **Build Type:** Debug testing build (signed with a temporary debug keystore)
          - **Notice:** This APK is intended for testing and verification only. It is not a production release for Google Play Store.
          EOF
          )

          echo "Creating release $RELEASE_TAG..."
          gh release create "$RELEASE_TAG" "$RELEASE_ASSET" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "### Build and Release Status" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            echo "GitHub Release created successfully."
            gh release view "$RELEASE_TAG" || true

            DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Asset: app-debug.apk"
            echo "Direct Download URL: $DIRECT_URL"

            echo "#### DIRECT APK DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
            echo "[Download app-debug.apk]($DIRECT_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Direct URL: \`$DIRECT_URL\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "*Note: The standard GitHub Actions artifact \`app-debug-apk\` remains available as a backup.*" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release creation failed or was skipped."
            echo "#### GitHub Release Notice" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ Release creation did not complete successfully." >> "$GITHUB_STEP_SUMMARY"
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The debug APK build succeeded and the GitHub Actions artifact **\`app-debug-apk\`** remains available for download." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
